[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-runtime"
version = "0.1.0"
description = "机器狗本体运行时内核"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sparkrobot-common",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sparkrobot-robot-runtime = "main:main"

[tool.ruff]
line-length = 200
exclude = ["build", ".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "Q"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
files = ["src"]
