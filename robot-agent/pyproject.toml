[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent"
version = "0.1.0"
description = "机器狗代理 (放置在机器狗身上) "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.0",
    "tomli>=2.4.0",
    "tomli-w>=1.2.0",
    "uuid6>=2025.0.1",
    "numpy>=2.2.6",
    "sounddevice>=0.5.5",
    "opuslib>=3.0.1",
    "watchdog>=6.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sparkrobot-robot-agent = "main:main"

# ============================
# 下面是 lint/typecheck 配置
# ============================

[tool.ruff]
line-length = 200
exclude = ["build", ".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "Q"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
files = ["src"]
