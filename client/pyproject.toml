[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-chat-client"
version = "0.1.0"
description = "机器狗聊天客户端"
readme = "src/README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.0",
    "tomli>=2.4.0",
    "tomli-w>=1.2.0",
    "uuid6>=2025.0.1",
    "numpy>=2.2.6",
    "sounddevice>=0.5.5",
    "opuslib>=3.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["robot_client", "core"]

[tool.setuptools.packages.find]
where = ["src"]

# ============================
# 下面是 lint/typecheck 配置
# ============================

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "C", "B", "Q"]
exclude = ["build", ".venv", ".git", "__pycache__"]

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src"]
