[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-server"
version = "0.1.0"
description = "机器狗配置服务器 - 提供配置管理和 WiFi 配置的 HTTP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sparkrobot-common",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "zeroconf>=0.131.0",
    "ruamel.yaml>=0.19.1",
    "python-multipart>=0.0.22", # TODO: 这个在哪个版本不用安装来着
]

[tool.setuptools]
packages = ["src", "src.路由", "src.服务"]

# ============================
# 下面是 lint/typecheck 配置
# ============================

[tool.ruff]
line-length = 200
exclude = ["build", ".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "Q"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
files = ["src"]
