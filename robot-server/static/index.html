<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机器狗配置中心</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 登录界面 -->
    <div id="loginOverlay" class="login-overlay">
      <div class="login-box">
        <h2>🔐 登录</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginUsername">用户名</label>
            <input
              type="text"
              id="loginUsername"
              required
              autocomplete="username"
              placeholder="请输入用户名"
            />
          </div>
          <div class="form-group">
            <label for="loginPassword">密码</label>
            <input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
              placeholder="请输入密码"
            />
          </div>
          <button type="submit" class="btn-full">登录</button>
        </form>
        <div id="loginMessage" class="message"></div>
      </div>
    </div>

    <!-- 用户信息 -->
    <div id="userInfo" class="user-info hidden">
      <span>👤</span>
      <span class="username" id="displayUsername"></span>
      <button class="secondary" onclick="handleLogout()">登出</button>
    </div>

    <div class="container">
      <h1>机器狗配置中心</h1>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('system')">
          系统设置
        </button>
        <button class="tab" onclick="switchTab('config')">高级配置</button>
        <button class="tab" onclick="switchTab('sdk')">群控配置</button>
      </div>

      <!-- 系统设置页面 -->
      <div id="system-tab" class="tab-content active">
        <!-- 音量控制 -->
        <div class="collapse-section">
          <div class="collapse-header" onclick="toggleCollapse('volume')">
            <h3>🔊 音量控制</h3>
            <span class="collapse-icon expanded" id="volume-icon">▼</span>
          </div>
          <div class="collapse-content expanded" id="volume-content">
            <div class="collapse-body">
              <div class="form-group">
                <label>系统音量</label>
                <div class="volume-control">
                  <input
                    type="range"
                    class="volume-slider"
                    id="volumeSlider"
                    min="0"
                    max="100"
                    value="50"
                    aria-label="系统音量"
                    oninput="updateVolumeDisplay(this.value)"
                  />
                  <span class="volume-value" id="volumeValue">50%</span>
                  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
                    🔇 静音
                  </button>
                </div>
              </div>
              <div class="btn-group">
                <button onclick="loadVolume()">🔄 刷新</button>
                <button onclick="setVolume()">💾 应用</button>
              </div>
              <div id="volumeMessage" class="message"></div>
            </div>
          </div>
        </div>

        <!-- WiFi设置 -->
        <div class="collapse-section">
          <div class="collapse-header" onclick="toggleCollapse('wifi')">
            <h3>🛜 WiFi设置</h3>
            <span class="collapse-icon expanded" id="wifi-icon">▼</span>
          </div>
          <div class="collapse-content expanded" id="wifi-content">
            <div class="collapse-body">
              <div class="card-title">
                可用WiFi网络
                <button
                  class="refresh-btn secondary"
                  id="refreshWifi"
                  onclick="scanWifi()"
                >
                  刷新
                </button>
              </div>
              <div id="wifiList" class="wifi-list">
                <div class="loading">正在扫描WiFi...</div>
              </div>

              <div class="wifi-connect-form">
                <div class="card-title">连接WiFi</div>
                <form id="wifiForm" onsubmit="connectWifi(event)">
                  <div class="form-group">
                    <label for="ssid">WiFi名称</label>
                    <input
                      type="text"
                      id="ssid"
                      name="ssid"
                      required
                      placeholder="请选择或输入WiFi名称"
                    />
                  </div>
                  <div class="form-group">
                    <label for="password">WiFi密码</label>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      required
                      placeholder="请输入WiFi密码"
                    />
                  </div>
                  <button type="submit">🔗 连接WiFi</button>
                </form>
                <div id="wifiMessage" class="message"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 系统配置页面 -->
      <div id="config-tab" class="tab-content">
        <div class="btn-group config-actions">
          <button class="secondary" onclick="saveConfig()">💾 保存配置</button>
          <button onclick="loadConfig()">🔄 刷新配置</button>
          <button class="danger" onclick="resetConfig()">↩️ 重置为默认</button>
        </div>

        <div id="configContainer">
          <div class="loading">正在加载配置...</div>
        </div>

        <div id="configMessage" class="message"></div>
      </div>

      <!-- 群控配置页面 -->
      <div id="sdk-tab" class="tab-content">
        <!-- SDK 配置折叠区 -->
        <div class="collapse-section">
          <div class="collapse-header" onclick="toggleCollapse('sdkConfig')">
            <h3>📡 SDK 配置</h3>
            <span class="collapse-icon expanded" id="sdkConfig-icon">▼</span>
          </div>
          <div class="collapse-content expanded" id="sdkConfig-content">
            <div class="collapse-body">
              <div id="sdkCurrentValue" class="current-value">
                <strong>当前配置:</strong> 加载中...
              </div>

              <div class="form-group">
                <label for="sdkTargetIp">目标 IP 地址（控制端 IP）</label>
                <input
                  type="text"
                  id="sdkTargetIp"
                  placeholder="例如: 192.168.1.100"
                />
              </div>

              <div class="form-group">
                <label for="sdkTargetPort">目标端口号 （控制端 端口号）</label>
                <input
                  type="number"
                  id="sdkTargetPort"
                  placeholder="默认: 43988"
                  value="43988"
                />
              </div>

              <div class="btn-group">
                <button onclick="updateSdkConfig()">💾 修改配置</button>
                <button class="secondary" onclick="loadSdkConfig()">
                  🔄 刷新
                </button>
                <button class="danger" onclick="resetSdkConfig()">
                  ↩️ 重置
                </button>
              </div>

              <div id="sdkMessage" class="message"></div>
            </div>
          </div>
        </div>

        <!-- 运控配置折叠区 -->
        <div class="collapse-section">
          <div class="collapse-header" onclick="toggleCollapse('motion')">
            <h3>⚙️ 运控配置</h3>
            <span class="collapse-icon expanded" id="motion-icon">▼</span>
          </div>
          <div class="collapse-content expanded" id="motion-content">
            <div class="collapse-body">
              <div id="motionCurrentValue" class="current-value">
                <strong>当前配置:</strong> 加载中...
              </div>

              <div class="form-group">
                <label for="motionSdkClientIp"
                  >SDK 客户端 IP（机器狗 IP）</label
                >
                <input
                  type="text"
                  id="motionSdkClientIp"
                  placeholder="例如: 192.168.1.100，留空表示 AP/有线模式"
                />
              </div>

              <div class="btn-group">
                <button onclick="updateMotionConfig()">💾 修改配置</button>
                <button class="secondary" onclick="loadMotionConfig()">
                  🔄 刷新
                </button>
                <button class="danger" onclick="resetMotionConfig()">
                  ↩️ 重置
                </button>
              </div>

              <div id="motionMessage" class="message"></div>
            </div>
          </div>
        </div>

        <!-- 运控服务管理折叠区 -->
        <div class="collapse-section">
          <div
            class="collapse-header"
            onclick="toggleCollapse('motionService')"
          >
            <h3>🔧 运控服务管理</h3>
            <span class="collapse-icon expanded" id="motionService-icon"
              >▼</span
            >
          </div>
          <div class="collapse-content expanded" id="motionService-content">
            <div class="collapse-body">
              <div class="warning-box">
                <strong>⚠️ 重要提示</strong>
                重启运控前请确保机器狗已经卧倒，否则会急停！
              </div>

              <button class="btn-success btn-full" onclick="restartMotion()">
                🔄 重启运控服务
              </button>

              <div id="restartMessage" class="message"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
